name: Bug Report
description: Report unexpected behavior, crashes, or device detection failures
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much hardware and software detail as possible.
  - type: input
    id: board
    attributes:
      label: Microcontroller & Board Model
      description: What specific hardware target are you using? (e.g. ESP32-WROOM-32, ESP32-S3-DevKitC-1, Raspberry Pi Pico)
      placeholder: e.g. ESP32-S3-DevKitC-1 (N16R8)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Toolchain
      description: OS version and PlatformIO / Python version
      placeholder: macOS 14.5, Python 3.11.8, PlatformIO Core 6.1.15
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What commands did you run or what actions triggered the issue?
      placeholder: |
        1. Configured hil.yaml with target: esp32s3
        2. Ran `hil heal`
        3. Observed error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Crash Dumps
      description: Paste terminal logs or serial output here (wrap in code block)
      render: shell
    validations:
      required: false
