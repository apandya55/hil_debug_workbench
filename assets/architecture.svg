<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <style>
      .canvas { fill: #090d16; }
      .panel { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .panel-focus { fill: #111e38; stroke: #3b82f6; stroke-width: 1.5; rx: 12px; }
      .panel-accent { fill: #19162b; stroke: #8b5cf6; stroke-width: 1.5; rx: 12px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.3px; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .body-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }
      .body-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #64748b; }
      
      .tag-teal { fill: #042f2e; stroke: #0d9488; stroke-width: 1; rx: 4px; }
      .tag-teal-t { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #2dd4bf; }
      .tag-blue { fill: #172554; stroke: #2563eb; stroke-width: 1; rx: 4px; }
      .tag-blue-t { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #60a5fa; }
      .tag-amber { fill: #451a03; stroke: #d97706; stroke-width: 1; rx: 4px; }
      .tag-amber-t { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #fbbf24; }
      .tag-purple { fill: #2e1065; stroke: #7c3aed; stroke-width: 1; rx: 4px; }
      .tag-purple-t { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #c084fc; }
      .tag-green { fill: #052e16; stroke: #16a34a; stroke-width: 1; rx: 4px; }
      .tag-green-t { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; fill: #4ade80; }

      .flow-line { stroke: #334155; stroke-width: 2; fill: none; }
      .flow-active { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .flow-patch { stroke: #10b981; stroke-width: 2; stroke-dasharray: 5,4; fill: none; }
      .flow-error { stroke: #ef4444; stroke-width: 2; fill: none; }
    </style>

    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#10b981" />
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#a855f7" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" class="canvas" rx="16" />

  <!-- Title & Subtitle Banner -->
  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">
    HIL Debug Workbench — Architecture &amp; Autonomous Healing Loop
  </text>
  <text x="36" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">
    Physical hardware-in-the-loop crash interception, symbol resolution, and autonomous LLM repair loop
  </text>

  <!-- TOP ROW: THE RUNTIME PIPELINE -->

  <!-- Node 1: Physical Hardware Target -->
  <g transform="translate(36, 82)">
    <rect width="200" height="180" class="panel" />
    <circle cx="24" cy="24" r="8" fill="#10b981" />
    <text x="40" y="28" class="header-title">Physical Hardware</text>
    <text x="16" y="48" class="header-sub">ESP32 / S3 &amp; RP2040 Pico</text>
    <line x1="16" y1="58" x2="184" y2="58" stroke="#1e293b" stroke-width="1" />

    <rect x="16" y="70" width="75" height="18" class="tag-teal" />
    <text x="22" y="83" class="tag-teal-t">CP2102/CH340</text>
    <rect x="98" y="70" width="86" height="18" class="tag-teal" />
    <text x="104" y="83" class="tag-teal-t">USB-CDC Serial</text>

    <text x="16" y="112" class="body-text">• Auto VID:PID scan</text>
    <text x="16" y="132" class="body-text">• 115200 baud stream</text>
    <text x="16" y="152" class="body-text">• Zero-overhead probe</text>
  </g>

  <!-- Node 2: Serial Monitor & Crash Detection -->
  <g transform="translate(268, 82)">
    <rect width="210" height="180" class="panel-focus" />
    <circle cx="24" cy="24" r="8" fill="#3b82f6" />
    <text x="40" y="28" class="header-title">Serial Crash Monitor</text>
    <text x="16" y="48" class="header-sub">Background thread + asyncio queue</text>
    <line x1="16" y1="58" x2="194" y2="58" stroke="#1e293b" stroke-width="1" />

    <rect x="16" y="70" width="82" height="18" class="tag-blue" />
    <text x="22" y="83" class="tag-blue-t">Regex Detector</text>
    <rect x="105" y="70" width="89" height="18" class="tag-amber" />
    <text x="111" y="83" class="tag-amber-t">Stability Timer</text>

    <text x="16" y="112" class="body-text">• Guru Meditation</text>
    <text x="16" y="130" class="body-text">• Stack smashing / WDT</text>
    <text x="16" y="148" class="body-text">• Cortex HardFaults</text>
    <text x="16" y="166" class="body-dim">Rolling 60-line context window</text>
  </g>

  <!-- Node 3: Addr2line Symbol Resolver -->
  <g transform="translate(510, 82)">
    <rect width="200" height="180" class="panel" />
    <circle cx="24" cy="24" r="8" fill="#f59e0b" />
    <text x="40" y="28" class="header-title">Crash Analyzer</text>
    <text x="16" y="48" class="header-sub">PlatformIO toolchain resolver</text>
    <line x1="16" y1="58" x2="184" y2="58" stroke="#1e293b" stroke-width="1" />

    <rect x="16" y="70" width="84" height="18" class="tag-amber" />
    <text x="22" y="83" class="tag-amber-t">ELF Symbolizer</text>
    <rect x="107" y="70" width="77" height="18" class="tag-blue" />
    <text x="113" y="83" class="tag-blue-t">addr2line -pfiaC</text>

    <text x="16" y="112" class="body-text">• Hex frame decoding</text>
    <text x="16" y="132" class="body-text">• C++ symbol demangling</text>
    <text x="16" y="152" class="body-text">• File + line extraction</text>
  </g>

  <!-- Node 4: AI Healing Agent -->
  <g transform="translate(742, 82)">
    <rect width="182" height="180" class="panel-accent" />
    <circle cx="24" cy="24" r="8" fill="#a855f7" />
    <text x="40" y="28" class="header-title">AI Self-Heal Loop</text>
    <text x="16" y="48" class="header-sub">Anthropic Claude Sonnet/Opus</text>
    <line x1="16" y1="58" x2="166" y2="58" stroke="#1e293b" stroke-width="1" />

    <rect x="16" y="70" width="70" height="18" class="tag-purple" />
    <text x="22" y="83" class="tag-purple-t">Structured Fix</text>
    <rect x="92" y="70" width="74" height="18" class="tag-green" />
    <text x="98" y="83" class="tag-green-t">Symlink Guard</text>

    <text x="16" y="112" class="body-text">• Source snippets</text>
    <text x="16" y="132" class="body-text">• Exact patch replace</text>
    <text x="16" y="152" class="body-text">• Bounded max cycles</text>
  </g>

  <!-- BOTTOM ROW: USER INTERFACES & PLATFORMIO TOOLCHAIN -->

  <!-- Node 5: PlatformIO Toolchain & Flasher -->
  <g transform="translate(510, 295)">
    <rect width="414" height="135" class="panel" />
    <circle cx="24" cy="24" r="8" fill="#10b981" />
    <text x="40" y="28" class="header-title">PlatformIO Build &amp; Flash Pipeline</text>
    <text x="16" y="48" class="header-sub">Async subprocess invocation (pio run -t upload)</text>
    <line x1="16" y1="58" x2="398" y2="58" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="82" class="body-text">• Automatically recompiles patched C/C++ firmware</text>
    <text x="16" y="102" class="body-text">• Streams compiler and esptool / picotool build logs</text>
    <text x="16" y="122" class="body-dim">On flash success ➔ resets monitor &amp; restarts stability observation window</text>
  </g>

  <!-- Node 6: Dual Monitoring Interfaces -->
  <g transform="translate(36, 295)">
    <rect width="442" height="135" class="panel" />
    <circle cx="24" cy="24" r="8" fill="#38bdf8" />
    <text x="40" y="28" class="header-title">Developer Inspection Interfaces</text>
    <text x="16" y="48" class="header-sub">Web Dashboard (FastAPI / WebSocket) &amp; Textual TUI</text>
    <line x1="16" y1="58" x2="426" y2="58" stroke="#1e293b" stroke-width="1" />

    <rect x="16" y="72" width="98" height="18" class="tag-blue" />
    <text x="22" y="85" class="tag-blue-t">localhost:3000</text>
    <rect x="122" y="72" width="80" height="18" class="tag-teal" />
    <text x="128" y="85" class="tag-teal-t">hil tui (CLI)</text>

    <text x="16" y="112" class="body-text">• Live ANSI serial log streaming with crash highlighting</text>
    <text x="16" y="128" class="body-dim">Pipeline state machine (IDLE ➔ FLASH ➔ MONITOR ➔ HEAL ➔ STABLE)</text>
  </g>

  <!-- CONNECTING ARROWS -->

  <!-- 1 -> 2: Serial Dump -->
  <line x1="236" y1="162" x2="266" y2="162" class="flow-active" marker-end="url(#arrow-blue)" />
  <text x="242" y="152" class="body-dim" font-size="9">TTY</text>

  <!-- 2 -> 3: Panic Event -->
  <line x1="478" y1="162" x2="508" y2="162" class="flow-error" marker-end="url(#arrow-red)" />
  <text x="482" y="152" class="body-dim" font-size="9">Crash</text>

  <!-- 3 -> 4: Symbolized Backtrace -->
  <line x1="710" y1="162" x2="740" y2="162" class="flow-active" marker-end="url(#arrow-blue)" />
  <text x="712" y="152" class="body-dim" font-size="9">Trace</text>

  <!-- 4 -> 5: Verified Source Patch -->
  <path d="M 833,262 L 833,293" class="flow-patch" marker-end="url(#arrow-green)" />
  <text x="840" y="280" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#10b981">Patch applied</text>

  <!-- 5 -> 1: Re-flash Feedback Loop -->
  <path d="M 510,362 L 136,362 L 136,264" class="flow-patch" marker-end="url(#arrow-green)" />
  <text x="270" y="354" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#10b981">
    Re-flash firmware via esptool / picotool
  </text>

  <!-- Telemetry feed to UI -->
  <path d="M 373,262 L 373,293" class="flow-line" stroke-dasharray="3,3" />
</svg>
