[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hil-debug-workbench"
version = "0.1.0"
description = "Autonomous hardware-in-the-loop debugger for ESP32 and RP2040 microcontrollers with AI-powered crash analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Arnav Pandya", email = "arnav.pdy2024@gmail.com" }
]
maintainers = [
    { name = "Arnav Pandya", email = "arnav.pdy2024@gmail.com" }
]
keywords = [
    "embedded",
    "esp32",
    "rp2040",
    "hardware-testing",
    "firmware",
    "debugging",
    "ai",
    "platformio",
    "microcontroller",
    "automation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pyserial>=3.5",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
    "rich>=13.7",
    "textual>=0.47",
    "anthropic>=0.25",
    "httpx>=0.25",
    "aiofiles>=23.2",
    "psutil>=5.9",
    "anyio>=4.2",
]

[project.urls]
Homepage = "https://github.com/apandya55/hil_debug_workbench"
Documentation = "https://github.com/apandya55/hil_debug_workbench#readme"
Repository = "https://github.com/apandya55/hil_debug_workbench.git"
Issues = "https://github.com/apandya55/hil_debug_workbench/issues"
Changelog = "https://github.com/apandya55/hil_debug_workbench/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.4",
    "pre-commit>=3.6",
    "bandit[toml]>=1.7",
    "safety>=3.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
hil = "hil_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hil_cli", "dashboard", "tui"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/static/index.html" = "dashboard/static/index.html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false
disallow_subclassing_any = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "serial.*",
    "textual.*",
    "anthropic.*",
    "fastapi.*",
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=hil_cli",
    "--cov=dashboard",
    "--cov=tui",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "hardware: marks tests that require physical hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["hil_cli", "dashboard", "tui"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
